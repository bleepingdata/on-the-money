<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On The Money - Bank Accounts</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; }
        h1, h2 { text-align: center; }
        nav { text-align: center; margin-bottom: 1.5rem; }
        nav a { color: #007bff; text-decoration: none; font-size: 1rem; }
        nav a:hover { text-decoration: underline; }
        #status { margin-bottom: 1rem; font-weight: bold; font-size: 1rem; text-align: center; min-height: 1.5rem; }
        .error { color: red; }
        .options { text-align: center; margin-bottom: 1.5rem; }
        .table-wrapper { overflow-x: auto; max-width: 1000px; margin: 0 auto 2rem auto; }
        table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        th { background-color: #007bff; color: white; padding: 8px 10px; text-align: left; white-space: nowrap; }
        td { border: 1px solid #ddd; padding: 6px 10px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9f0ff; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .negative { color: #dc3545; }
        tfoot td { font-weight: bold; background-color: #e9ecef; }
    </style>
</head>
<body>
    <h1>Bank Accounts</h1>
    <nav><a href="/">&larr; Back to Manager</a></nav>
    <div class="options">
        <label><input type="checkbox" id="chkIncludeClosed"> Include closed accounts</label>
    </div>
    <div id="status">Loading...</div>

    <h2>Summary</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Account Type</th>
                    <th class="num">Accounts</th>
                    <th class="num">Total Balance</th>
                </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
            <tfoot id="summaryFoot"></tfoot>
        </table>
    </div>

    <h2>Accounts</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Account</th>
                    <th>Type</th>
                    <th>Opened</th>
                    <th>Closes</th>
                    <th>Last Transaction</th>
                    <th class="num">Transactions</th>
                    <th class="num">Current Balance</th>
                </tr>
            </thead>
            <tbody id="accountsBody"></tbody>
        </table>
    </div>

    <script>
        const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'NZD' });

        function addCell(row, text, className) {
            const td = document.createElement('td');
            td.textContent = text;
            if (className) td.className = className;
            row.appendChild(td);
        }

        function balanceClass(value) {
            return value < 0 ? 'num negative' : 'num';
        }

        async function fetchJson(url) {
            const response = await fetch(url);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || response.statusText);
            return data;
        }

        async function loadData() {
            const statusDiv = document.getElementById('status');
            const query = `?include_closed=${document.getElementById('chkIncludeClosed').checked}`;
            statusDiv.textContent = 'Loading...';
            statusDiv.className = '';

            try {
                const [accounts, summary] = await Promise.all([
                    fetchJson(`/accounts/bank/balances${query}`),
                    fetchJson(`/accounts/bank/summary${query}`)
                ]);

                const accountsBody = document.getElementById('accountsBody');
                accountsBody.replaceChildren();
                accounts.forEach(acc => {
                    const row = document.createElement('tr');
                    addCell(row, acc.description);
                    addCell(row, acc.bank_account_type);
                    addCell(row, acc.open_date || '');
                    addCell(row, acc.close_date || '');
                    addCell(row, acc.last_transaction_date || '');
                    addCell(row, acc.transaction_count, 'num');
                    addCell(row, money.format(acc.current_balance), balanceClass(acc.current_balance));
                    accountsBody.appendChild(row);
                });

                const summaryBody = document.getElementById('summaryBody');
                const summaryFoot = document.getElementById('summaryFoot');
                summaryBody.replaceChildren();
                summaryFoot.replaceChildren();
                let totalCount = 0;
                let totalBalance = 0;
                summary.forEach(item => {
                    const row = document.createElement('tr');
                    addCell(row, item.bank_account_type);
                    addCell(row, item.account_count, 'num');
                    addCell(row, money.format(item.total_balance), balanceClass(item.total_balance));
                    summaryBody.appendChild(row);
                    totalCount += item.account_count;
                    totalBalance += item.total_balance;
                });
                const footRow = document.createElement('tr');
                addCell(footRow, 'Net total');
                addCell(footRow, totalCount, 'num');
                addCell(footRow, money.format(totalBalance), balanceClass(totalBalance));
                summaryFoot.appendChild(footRow);

                statusDiv.textContent = accounts.length === 0 ? 'No bank accounts found.' : '';
            } catch (err) {
                statusDiv.textContent = 'Error: ' + err.message;
                statusDiv.className = 'error';
            }
        }

        document.getElementById('chkIncludeClosed').addEventListener('change', loadData);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
